name: Bot tendance

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-tendance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer le bot (simulation papier)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot_tendance.py
      - name: Enregistrer l'etat
        run: |
          git config user.name "bot-tendance"
          git config user.email "bot-tendance@users.noreply.github.com"
          git add docs/data/state.json
          if git diff --cached --quiet; then
            echo "Rien a enregistrer"
          else
            git commit -m "mise a jour"
            git pull --rebase
            git push
          fi
